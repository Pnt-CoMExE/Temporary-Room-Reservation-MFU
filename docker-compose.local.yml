# Local Docker override — HTTP only, expose DB, skip certbot
services:
  postgres:
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init-schema.sql:/docker-entrypoint-initdb.d/01-init-schema.sql:ro

  backend:
    ports:
      - "3000:3000"

  frontend:
    ports:
      - "8080:80"
    volumes:
      - ./frontend/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro

  certbot:
    profiles:
      - never
