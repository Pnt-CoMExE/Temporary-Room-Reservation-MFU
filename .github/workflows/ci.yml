name: CI — Typecheck & Build

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

jobs:

  # ─── Backend: Typecheck + Build + Test ───────────────
  backend:
    name: Backend (Node + Express + TypeScript)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: mfu_booking_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    env:
      # App reads DB_* (not DATABASE_URL) — see backend/db.ts
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: mfu_booking_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      PORT: 3000
      JWT_SECRET: ci-test-secret
      FRONTEND_URL: http://localhost:5173
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      GOOGLE_CALLBACK_URL: http://localhost:3000/auth/google/callback
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: ./backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Init test database schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -d mfu_booking_test -f scripts/init-schema.sql

      - name: TypeScript type-check
        run: npm run typecheck

      - name: Build TypeScript
        run: npx tsc --outDir dist

      - name: Run tests
        run: npm test

  # ─── Frontend: Typecheck + Build ─────────────────────
  frontend:
    name: Frontend (Vue 3 + TypeScript + Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ./frontend/dist
          if-no-files-found: error

  # ─── Docker: Build images (Sprint 7) ─────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t mfu-space-backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: docker build -t mfu-space-frontend:${{ github.sha }} ./frontend
